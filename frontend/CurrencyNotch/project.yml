# XcodeGen spec. Generate with ./scripts/bootstrap.sh — the .xcodeproj is never committed.
# No signing identities or team IDs here: release.sh passes them from env vars (ADR-0005).
name: CurrencyNotch
options:
  bundleIdPrefix: com.afik
  developmentLanguage: he
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  CurrencyCore:
    path: ../../backend/CurrencyCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  CurrencyNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - CurrencyNotch.entitlements
    dependencies:
      - package: CurrencyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afik.CurrencyNotch
        PRODUCT_NAME: CurrencyNotch
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/CurrencyNotch.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Release must not carry get-task-allow (debugger attach); Debug keeps it for debugging.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  CurrencyNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CurrencyNotchTests
    dependencies:
      - target: CurrencyNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afik.CurrencyNotchTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CurrencyNotch:
    build:
      targets:
        CurrencyNotch: all
        CurrencyNotchTests: [test]
    test:
      targets:
        - CurrencyNotchTests
    run:
      config: Debug
